# NetBuddy Reverse-Proxy: TLS-Terminierung, SPA-Auslieferung, API → Backend.
# Liegt als Template unter /etc/nginx/templates/ → nginx envsubst ersetzt ${BACKEND_UPSTREAM}.

# HTTP → HTTPS umleiten (Credentials/Session nie im Klartext).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/netbuddy.crt;
    ssl_certificate_key /etc/nginx/certs/netbuddy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    # API-Pfade (Top-Level, kein /api-Präfix) ans Backend. Liste = die Router-Prefixe.
    # WICHTIG: bei jedem NEUEN Backend-Router (api/main.py) hier den Prefix ergänzen,
    # sonst landet der Pfad auf der SPA (index.html) -> "Unexpected token '<'"-Fehler im Frontend.
    location ~ ^/(topology|adapters|devices|device-credentials|discovery|sites|vlans|credentials|auth|users|health|search|unifi|vpn|audit|poe|endpoints|openapi\.json|docs|redoc) {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # Discovery/Validate können live länger dauern
        add_header Cache-Control "no-store" always;  # API-Antworten nie cachen (sonst stale JSON/HTML im Browser)
    }

    # Alles andere = SPA (Client-Routing → index.html-Fallback).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
