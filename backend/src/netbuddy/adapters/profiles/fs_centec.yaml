# FS.com FSOS — Centec-Familie (z.B. S5800/48MBQ, Interfaces "eth-0-x").
# Live validiert gegen bls-sw-53 / S5800-48MBQ / FSOS 7.0.4.5: system_info, interfaces (54),
# mac (206), lldp (echtes Block-Format inkl. System Name + Management Address, S30).
# ARP: Befehl + Header live bestätigt; Tabelle am L2-Testgerät leer → Zeilen-Fixture synthetisch.
adapter_id: fs_centec
provenance: "FS.com Centec/FSOS — live-validated (S5800-48MBQ 7.0.4.5): sysinfo/interfaces/mac/lldp; arp header-validated"

backup_command: "show running-config"

# Port→VLAN (Access): Centec/FSOS kennt kein `end` → `exit`.
port_vlan_control:
  config_enter: ["configure terminal"]
  config_exit: ["exit"]
  set_access: ["switchport mode access", "switchport access vlan {vlan}"]

# LLDP-Schreibpfad (Centec/FSOS): per Default ist LLDP global AUS ("global enabled : NO").
# `lldp enable` global + pro physischem Port (eth-0-x). Status via `show lldp local config`.
lldp_control:
  status_command: "show lldp local config"
  enabled_marker: 'global enabled\s*:\s*YES'
  config_enter: ["configure terminal"]
  config_exit: ["exit"]   # Centec/FSOS kennt kein `end`
  enable_global: ["lldp enable"]
  # Kein enable_interface: globales `lldp enable` reicht auf Centec, damit der Switch advertised
  # und vom Nachbarn (Core) erkannt wird. Per-Port über CLI wäre bei 48+ Ports zu langsam.

capabilities:
  read_system_info:
    command: "show version"
    parser: "textfsm:fs_centec_show_version.textfsm"
    fields:
      vendor: { const: fs }
      model: model
      os_version: os_version
      serial_number: serial
      device_type: { const: switch }

  read_interfaces:
    command: "show interface status"
    parser: "textfsm:fs_centec_show_interface_status.textfsm"
    fields:
      name: port
      description: { from: description, via: [strip_or_none] }
      oper_status:
        from: status
        via:
          - lookup:
              table: { up: up, down: down, "admin down": down }
              default: unknown
      interface_type: { from: type, via: [strip_or_none] }

  read_lldp:
    command: "show lldp neighbor"
    parser: "textfsm:fs_centec_show_lldp_neighbor.textfsm"
    fields:
      local_interface: local_interface
      remote_chassis_id: chassis_id
      remote_port_id: port_id
      remote_port_description: { from: port_desc, via: [strip_or_none] }
      remote_system_name: { from: system_name, via: [strip_or_none] }
      remote_system_description: { from: system_desc, via: [strip_or_none] }
      mgmt_address: { from: mgmt_address, via: [ip_or_none] }

  read_arp:
    command: "show ip arp"
    parser: "textfsm:fs_centec_show_ip_arp.textfsm"
    drop_when_empty: [mac_address]
    fields:
      ip_address: ip_address
      mac_address: mac
      interface: { from: interface, via: [strip_or_none] }

  read_mac_table:
    command: "show mac address-table"
    parser: "textfsm:fs_centec_show_mac_address-table.textfsm"
    drop_when_empty: [interface]
    fields:
      mac_address: mac
      interface: { from: port, via: [strip_or_none] }
      vlan_id: { from: vlan, via: [int_or_none] }
      entry_type:
        from: type
        via:
          - enum_value: { values_of: MacEntryType, default: dynamic }
