# Cisco NX-OS (Nexus 9000) — read-only. Geparst via ntc-templates (platform cisco_nxos).
# Live-validiert gegen s00ncs101/s00ncs102 (N9K-C93180YC-FX3, NX-OS 10.5(3), vPC-Paar Riese):
# system_info, interfaces, lldp (nach `feature lldp`, 9 Nachbarn je Switch), mac, arp, config.
# Ohne `feature lldp` antwortet NX-OS mit "% Invalid command" → read_lldp liefert leer, kein Fehler.
adapter_id: cisco_nxos
ntc_platform: cisco_nxos
provenance: "Cisco NX-OS — live-validated (N9K-C93180YC-FX3 10.5(3)): sysinfo/interfaces/lldp/mac/arp/config"

backup_command: "show running-config"

# NX-OS: LLDP ist ein Feature-Flag (`feature lldp`), danach global auf allen Ports aktiv.
# `show lldp timers` antwortet nur bei aktivem Feature ("LLDP Timers"), sonst "% Invalid command".
lldp_control:
  status_command: "show lldp timers"
  enabled_marker: 'LLDP Timers'
  config_enter: ["configure terminal"]
  config_exit: ["end"]
  enable_global: ["feature lldp"]
  save: ["copy running-config startup-config"]

# Port→VLAN (Access): IOS-ähnliche Syntax; Save = copy run start ("Copy complete").
port_vlan_control:
  config_enter: ["configure terminal"]
  config_exit: ["end"]
  set_access: ["switchport mode access", "switchport access vlan {vlan}"]
  save: ["copy running-config startup-config"]
  save_marker: "Copy complete"
  verify_command: "show running-config interface {name}"
  verify_pattern: 'switchport access vlan {vlan}\b'

capabilities:
  read_system_info:
    command: "show version"
    parser: ntc
    fields:
      hostname: { from: hostname, via: [strip_or_none], default: "" }
      vendor: { const: cisco }
      model: { from: platform, via: [strip_or_none] }       # z.B. "C93180YC-FX3"
      os_version: { from: os, via: [first_word] }            # "10.5(3) [Feature Release]" → "10.5(3)"
      serial_number: { from: serial, via: [strip_or_none] }
      device_type: { const: switch }

  read_interfaces:
    command: "show interface"
    parser: ntc
    fields:
      name: interface
      description: { from: description, via: [strip_or_none] }
      admin_status:
        from: admin_state
        via:
          - first_word
          - lookup:  # SVIs melden "up, autostate enabled" → first_word liefert "up,"
              table: { up: up, "up,": up, down: down, "down,": down }
              default: unknown
      oper_status:
        from: link_status
        via:
          - first_word
          - lookup:
              table: { up: up, down: down }
              default: unknown
      mac_address: { from: mac_address, via: [strip_or_none] }
      speed_mbps: { from: bandwidth, via: [kbit_to_mbps] }
      mtu: { from: mtu, via: [int_or_none] }
      interface_type: { from: hardware_type, via: [strip_or_none] }

  # Hinweis ntc-Template: "System Name" wird als \S+ gematcht → Nachbarn mit Leerzeichen im
  # Namen (Meraki: "Meraki MS425-16 - S00NSW100") fallen weg. Für Meraki-Nachbarn CDP nutzen.
  read_lldp:
    command: "show lldp neighbors detail"
    parser: ntc
    fields:
      local_interface: local_interface
      remote_chassis_id: chassis_id
      remote_port_id: neighbor_interface
      remote_system_name: { from: neighbor_name, via: [strip_or_none] }
      remote_system_description: { from: neighbor_description, via: [strip_or_none] }
      mgmt_address: { from: mgmt_address, via: [ip_or_none] }

  read_mac_table:
    command: "show mac address-table"
    parser: ntc
    drop_when_empty: [interface]
    fields:
      mac_address: mac_address
      interface: { from: ports, via: [strip_or_none] }
      vlan_id: { from: vlan_id, via: [int_or_none] }
      entry_type:
        from: type
        via:
          - enum_value: { values_of: MacEntryType, default: dynamic }

  read_arp:
    command: "show ip arp"
    parser: ntc
    drop_when_empty: [mac_address]
    fields:
      ip_address: ip_address
      mac_address: mac_address
      interface: { from: interface, via: [strip_or_none] }
