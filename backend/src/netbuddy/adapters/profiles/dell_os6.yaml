# Dell OS6 (N-Series / PowerConnect) — read-only.
# LIVE validiert via Telnet (BLS-SW-52 / N2248PX-ON / 6.6.3.15): sysinfo, interfaces (51),
# mac (193), arp (20), lldp (Summary-Format, echtes Capture). Enable-Mode nötig (Pager).
adapter_id: dell_os6
provenance: "Dell OS6 — live-validated via telnet (N2248PX-ON 6.6.3.15): sysinfo/interfaces/mac/arp/lldp"

backup_command: "show running-config"

# Dell N-Series: LLDP ist global per Default aktiv (kein globaler An/Aus-Schalter wie Cisco);
# steuerbar wäre nur per Port (lldp transmit/receive). Marker erkennt den globalen LLDP-Block.
lldp_control:
  status_command: "show lldp"
  enabled_marker: 'LLDP Global Configuration'
  config_enter: ["configure"]
  config_exit: ["end"]
  enable_global: []
  enable_interface: ["lldp transmit", "lldp receive"]
  interface_enter: "interface {name}"
  interface_exit: "exit"

capabilities:
  read_system_info:
    command: "show version"
    parser: "textfsm:dell_os6_show_version.textfsm"
    fields:
      vendor: { const: dell }
      model: model
      os_version: os_version
      serial_number: serial
      device_type: { const: switch }

  read_interfaces:
    command: "show interfaces status"
    parser: "textfsm:dell_os6_show_interfaces_status.textfsm"
    fields:
      name: port
      description: { from: description, via: [strip_or_none] }
      oper_status:
        from: link
        via:
          - lookup:
              table: { up: up, down: down }
              default: unknown
      speed_mbps: { from: speed, via: [leading_int] }

  read_lldp:
    # Live-Format (BLS-SW-52 via Telnet): OS6 kennt nur die Summary-Tabelle ohne Argument
    # ("detail" verlangt ein Interface). Keine Mgmt-Adresse in der Summary — die kommt
    # über den ARP-Fallback der Vorschläge (OS6-ARP liest seit S30/S35).
    command: "show lldp remote-device all"
    parser: "textfsm:dell_os6_show_lldp_remote-device_all.textfsm"
    fields:
      local_interface: local_interface
      remote_chassis_id: chassis_id
      remote_port_id: port_id
      remote_system_name: { from: system_name, via: [strip_or_none] }

  read_arp:
    command: "show arp"
    parser: "textfsm:dell_os6_show_arp.textfsm"
    drop_when_empty: [mac_address]
    fields:
      ip_address: ip_address
      mac_address: mac
      interface: { from: interface, via: [strip_or_none] }

  read_mac_table:
    command: "show mac address-table"
    parser: "textfsm:dell_os6_show_mac_address-table.textfsm"
    drop_when_empty: [interface]
    fields:
      mac_address: mac
      interface: { from: port, via: [strip_or_none] }
      vlan_id: { from: vlan, via: [int_or_none] }
      entry_type:
        from: type
        via:
          - enum_value: { values_of: MacEntryType, default: dynamic }
