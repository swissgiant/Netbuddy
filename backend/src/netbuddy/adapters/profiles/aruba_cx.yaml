# HP Aruba — ArubaOS-CX (6000/6300). read-only + LLDP-/Backup-Pfad.
# LIVE validiert 9.10.2026 bei Belimed: swbat01 (R8N85A 6000-48G, PL.10.08), swbfi01/swbfr01
# (PL.10.11). Scrapli-GenericDriver, Pager via `no page`.
adapter_id: aruba_cx
provenance: "ArubaOS-CX — live-validated (Aruba 6000 PL.10.08/PL.10.11)"

backup_command: "show running-config"

# ArubaOS-CX: LLDP per Default aktiv; globaler Schalter `lldp`. Status via `show lldp configuration`
# ("LLDP ... : Yes/Enabled"). UNVALIDIERT (kein Aruba-Lab-Gerät).
lldp_control:
  status_command: "show lldp configuration"
  enabled_marker: '(?i)LLDP Enabled\s*:\s*Yes'
  config_enter: ["configure terminal"]
  config_exit: ["end"]
  enable_global: ["lldp"]
  save: ["write memory"]

capabilities:
  read_system_info:
    sources:
      - { command: "show version", parser: "textfsm:aruba_cx_show_version.textfsm" }
      - { command: "show system", parser: "textfsm:aruba_cx_show_system.textfsm" }
    fields:
      hostname: { from: hostname, via: [strip_or_none], default: "" }
      vendor: { const: aruba }
      model: { from: model, via: [strip_or_none] }
      os_version: version
      serial_number: { from: serial, via: [strip_or_none] }
      device_type: { const: switch }

  read_interfaces:
    command: "show interface brief"
    parser: "textfsm:aruba_cx_show_interface_brief.textfsm"
    fields:
      name: port
      oper_status:
        from: status
        via:
          - lower  # AOS-CX schreibt je nach Version "up"/"Up"
          - lookup:
              table: { up: up, down: down }
              default: unknown
      admin_status:
        from: enabled
        via:
          - lower  # "yes"/"Yes" case-unabhängig
          - lookup:
              table: { "yes": up, "no": down }
              default: unknown
      interface_type: { from: type, via: [placeholder_or_none] }
      description: { from: description, via: [placeholder_or_none] }
      speed_mbps: { from: speed, via: [leading_int] }

  read_lldp:
    # detail statt Kurztabelle: nur das Detail-Format liefert die Management-Adresse
    # (für Autodiscovery-Crawl + ARP-lose Nachbar-IP).
    command: "show lldp neighbor-info detail"
    parser: "textfsm:aruba_cx_show_lldp_neighbor-info_detail.textfsm"
    fields:
      local_interface: local_port
      remote_chassis_id: chassis_id
      remote_port_id: port_id
      remote_port_description: { from: port_desc, via: [strip_or_none] }
      remote_system_name: { from: system_name, via: [strip_or_none] }
      remote_system_description: { from: system_desc, via: [strip_or_none] }
      mgmt_address: { from: mgmt_address, via: [ip_or_none] }

  read_arp:
    command: "show arp"
    parser: "textfsm:aruba_cx_show_arp.textfsm"
    drop_when_empty: [mac_address]
    fields:
      ip_address: ip_address
      mac_address: mac
      interface: { from: interface, via: [strip_or_none] }

  read_mac_table:
    command: "show mac-address-table"
    parser: "textfsm:aruba_cx_show_mac-address-table.textfsm"
    drop_when_empty: [interface]
    fields:
      mac_address: mac
      interface: { from: port, via: [strip_or_none] }
      vlan_id: { from: vlan, via: [int_or_none] }
      entry_type:
        from: type
        via:
          - enum_value: { values_of: MacEntryType, default: dynamic }
